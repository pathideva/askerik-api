name: Deploy AskErik.Api to Azure App Service

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    env:
      AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
      AZURE_RG: ${{ secrets.AZURE_RG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore AskErik.Api/AskErik.Api.csproj

      - name: Build
        run: dotnet build --no-restore -c Release AskErik.Api/AskErik.Api.csproj

      - name: Publish
        run: dotnet publish AskErik.Api/AskErik.Api.csproj -c Release -o publish

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Postgres connection string in App Service
        # Uses the secret DB_PASSWORD to inject the password without committing it to repo
        run: |
          run: |
            az webapp config connection-string set \
              --resource-group "${{ secrets.AZURE_RG }}" \
              --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
              --settings "tellerikdb=Host=aws-1-eu-north-1.pooler.supabase.com;Database=postgres;Username=postgres.suerbvndoljmusgzyccm;Password=${{ secrets.DB_PASSWORD }};SSL Mode=Require;Trust Server Certificate=true" \
              --connection-string-type PostgreSQL

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
